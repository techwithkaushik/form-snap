[versions]
kotlin = "2.2.21"
agp = "8.10.1"
compose = "1.7.0"
material3 = "1.3.0"
composeCompiler = "2.2.21"
androidCompileSdk = "36"
androidMinSdk = "23"
androidTargetSdk = "36"
coroutines = "1.8.1"
serialization = "1.7.3"
room = "2.7.2"
camerax = "1.3.4"
activity = "1.9.2"
lifecycle = "2.8.6"
coreKtx = "1.13.1"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"
ucrop = "4.1.1-non-native"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }

androidx-compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }

camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

ucrop-n-edit = { module = "com.github.jens-muenker:uCrop-n-Edit", version.ref = "ucrop" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[bundles]
kmp-coroutines = ["kotlinx-coroutines-core", "kotlinx-coroutines-android"]
compose = ["androidx-compose-runtime", "androidx-compose-foundation", "androidx-compose-material3", "androidx-compose-ui"]
camerax = ["camerax-camera2", "camerax-lifecycle", "camerax-view"]
android-testing = ["junit", "androidx-junit", "espresso-core"]

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
