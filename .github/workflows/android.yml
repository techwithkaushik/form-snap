name: Android

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Download official OpenCV Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          OPENCV_VERSION="5.0.0"
          SDK_ZIP="$RUNNER_TEMP/opencv-android-sdk.zip"
          SDK_ROOT="$RUNNER_TEMP/opencv-sdk"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/opencv/opencv/releases/download/\${OPENCV_VERSION}/opencv-\${OPENCV_VERSION}-android-sdk.zip" \
            -o "$SDK_ZIP"
          rm -rf "$SDK_ROOT"
          mkdir -p "$SDK_ROOT"
          unzip -q "$SDK_ZIP" -d "$SDK_ROOT"
          SDK_DIR="$(find "$SDK_ROOT" -type d -path '*/sdk' -print -quit)"
          SDK_JAVA="$SDK_DIR/java"
          test -d "$SDK_JAVA"
          test -f "$SDK_JAVA/build.gradle"
          test -f "$SDK_JAVA/src/main/java/org/opencv/android/OpenCVLoader.java"
          test -f "$SDK_DIR/native/libs/armeabi-v7a/libopencv_java5.so"
          rm -rf opencv
          mkdir -p opencv
          cp -R "$SDK_DIR/." opencv/
          echo "Official OpenCV Android SDK staged."

      - name: Configure OpenCV module path
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('settings.gradle.kts')
          text = path.read_text()
          old = 'project(":opencv").projectDir = file("opencv")'
          new = 'project(":opencv").projectDir = file("opencv/java")'
          if old not in text:
              raise SystemExit('OpenCV project path entry not found')
          path.write_text(text.replace(old, new))
          PY
          grep -n 'project(":opencv")' settings.gradle.kts

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: enhanced
          validate-wrappers: false

      - name: Decode Keystore
        id: keystore
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: "dev_keystore.jks"
          encodedString: ${{ secrets.SIGNING_KEYSTORE }}

      - name: Build signed APK
        env:
          SIGN_KEY_STORE: ${{ steps.keystore.outputs.filePath }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -x "./gradlew" ]; then
            ./gradlew :app:assembleRelease --no-daemon --build-cache
          else
            gradle :app:assembleRelease --no-daemon --build-cache
          fi

      - name: Verify APK
        if: github.event_name == "push"
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        if: github.event_name == "push"
        uses: actions/upload-artifact@v4
        with:
          name: form-snap-arm32-java-opencv
          path: app/build/outputs/apk/release/app-release.apk
