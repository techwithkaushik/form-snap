name: Android

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Checkout OpenCV 5.0.0
        env:
          OPENCV_COMMIT: 40738fb16ceddb5fb3fea747585f7ce6abb0605b
        run: |
          set -euo pipefail
          git -c protocol.version=2 clone --filter=blob:none --no-checkout --depth 1 --branch 5.0.0 https://github.com/opencv/opencv.git opencv2
          git -C opencv2 checkout --detach "$OPENCV_COMMIT"
          test -f opencv2/modules/core/include/opencv2/core/version.hpp
          echo "OpenCV checkout:"
          git -C opencv2 rev-parse HEAD
          sed -n '/CV_VERSION_MAJOR/,+3p' opencv2/modules/core/include/opencv2/core/version.hpp

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: enhanced

      - name: Build OpenCV 5.0.0 Android SDK
        working-directory: opencv2
        run: |
          set -e
          rm -rf ../opencv-build
          python3 platforms/android/build_sdk.py \
            ../opencv-build \
            "$GITHUB_WORKSPACE/opencv2" \
            --modules_list core,imgproc,calib3d,features2d,flann,ml,objdetect,photo,stitching,video,videoio,highgui \
            --ndk_path "$ANDROID_NDK_ROOT" \
            --sdk_path "$ANDROID_HOME" \
            --config platforms/android/ndk-25.config.py \
            --no_kotlin \
            --no_ccache \
            --no_samples_build
          test -f ../opencv-build/OpenCV-android-sdk/sdk/native/jni/include/opencv2/core.hpp
          test -f ../opencv-build/OpenCV-android-sdk/sdk/native/libs/arm64-v8a/libopencv_java5.so
          test -f ../opencv-build/OpenCV-android-sdk/sdk/native/libs/armeabi-v7a/libopencv_java5.so
          rm -rf ../opencv2/android-sdk
          mkdir -p ../opencv2/android-sdk
          mv ../opencv-build/OpenCV-android-sdk ../opencv2/android-sdk/sdk
          rm -rf ../opencv-build
      - name: Decode Keystore
        id: keystore
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: 'dev_keystore.jks'
          encodedString: ${{ secrets.SIGNING_KEYSTORE }}

      - name: Build signed APK
        env:
          SIGN_KEY_STORE: ${{ steps.keystore.outputs.filePath }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -e
          if [ -x "./gradlew" ]; then
            ./gradlew :app:assembleRelease --no-daemon --build-cache
          else
            gradle :app:assembleRelease --no-daemon --build-cache
          fi

      - name: Verify APK
        if: github.event_name == 'push'
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: form-snap-arm32-compose
          path: app/build/outputs/apk/release/app-release.apk
