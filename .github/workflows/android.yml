name: Android

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Download OpenCV Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="5.0.0"
          curl --fail --location --retry 3 \
            "https://github.com/opencv/opencv/releases/download/${VERSION}/opencv-${VERSION}-android-sdk.zip" \
            -o "$RUNNER_TEMP/opencv-android-sdk.zip"
          rm -rf "$RUNNER_TEMP/opencv-sdk"
          mkdir -p "$RUNNER_TEMP/opencv-sdk"
          unzip -q "$RUNNER_TEMP/opencv-android-sdk.zip" -d "$RUNNER_TEMP/opencv-sdk"
          SDK_JAVA="$(find "$RUNNER_TEMP/opencv-sdk" -type d -path "*/sdk/java" -print -quit)"
          SDK_NATIVE="$(find "$RUNNER_TEMP/opencv-sdk" -type d -path "*/sdk/native" -print -quit)"
          test -n "$SDK_JAVA"
          test -n "$SDK_NATIVE"
          rm -rf opencv/src/main
          mkdir -p opencv/src/main
          cp -R "$SDK_JAVA/src" opencv/src/main/java
          cp -R "$SDK_JAVA/res" opencv/src/main/res
          cp "$SDK_JAVA/AndroidManifest.xml" opencv/src/main/AndroidManifest.xml
          echo "OpenCV Java SDK staged."
          test -f opencv/src/main/java/org/opencv/android/OpenCVLoader.java
          test -f "$SDK_NATIVE/libs/armeabi-v7a/libopencv_java5.so"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: enhanced
          validate-wrappers: false

      - name: Decode Keystore
        id: keystore
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: "dev_keystore.jks"
          encodedString: ${{ secrets.SIGNING_KEYSTORE }}

      - name: Build signed APK
        env:
          SIGN_KEY_STORE: ${{ steps.keystore.outputs.filePath }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -e
          if [ -x "./gradlew" ]; then
            ./gradlew :app:assembleRelease --no-daemon --build-cache
          else
            gradle :app:assembleRelease --no-daemon --build-cache
          fi

      - name: Verify APK
        if: github.event_name == "push"
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        if: github.event_name == "push"
        uses: actions/upload-artifact@v4
        with:
          name: form-snap-arm32-java-opencv
          path: app/build/outputs/apk/release/app-release.apk
