name: Android

on:
  workflow_dispatch:
  push:
    branches:
      - feature/foundation-pipeline
  pull_request:
    branches:
      - feature/foundation-pipeline

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/foundation-pipeline
          fetch-depth: 1
          submodules: false

      - name: Cache OpenCV Android SDK
        id: opencv-cache
        uses: actions/cache@v6
        with:
          path: opencv/
          key: opencv-android-sdk-5.0.0-${{ runner.os }}

      - name: Download OpenCV Android SDK 5.0.0
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          OPENCV_VERSION="5.0.0"
          ZIP="$RUNNER_TEMP/opencv-android-sdk.zip"
          ROOT="$RUNNER_TEMP/opencv-sdk"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/opencv/opencv/releases/download/${OPENCV_VERSION}/opencv-${OPENCV_VERSION}-android-sdk.zip" \
            -o "$ZIP"
          rm -rf "$ROOT" opencv
          mkdir -p "$ROOT" opencv
          unzip -q "$ZIP" -d "$ROOT"
          SDK_DIR="$(find "$ROOT" -type d -path '*/sdk' -print -quit)"
          test -n "$SDK_DIR"
          test -d "$SDK_DIR/java"
          cp -R "$SDK_DIR/." opencv/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: false

      - name: Download bootstrap YOLOv8 model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="core/ai/src/main/assets"
          MODEL="$MODEL_DIR/formsnap_bootstrap_yolov8n_float32.tflite"
          mkdir -p "$MODEL_DIR"
          curl --fail --location --retry 5 --retry-all-errors             "https://raw.githubusercontent.com/naz23/yolo-tensorflow-lite/main/yolov8n_float32.tflite"             -o "$MODEL"
          test -s "$MODEL"
          test "$(stat -c%s "$MODEL")" -gt 1000000
          ls -lh "$MODEL"

      - name: Remove AI model before APK packaging
        shell: bash
        run: |
          set -euo pipefail
          MODEL="core/ai/src/main/assets/formsnap_bootstrap_yolov8n_float32.tflite"
          test -f "$MODEL"
          rm -f "$MODEL"
          test ! -e "$MODEL"

      - name: Decode Keystore
        id: keystore
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: dev_keystore.jks
          encodedString: ${{ secrets.SIGNING_KEYSTORE }}

      - name: Build signed APK
        env:
          SIGN_KEY_STORE: ${{ steps.keystore.outputs.filePath }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon --build-cache --stacktrace
          else
            gradle :app:assembleRelease --no-daemon --build-cache --stacktrace
          fi

      - name: Build standalone Dataset Builder APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :dataset-builder:assembleDebug --no-daemon --build-cache --stacktrace
          else
            gradle :dataset-builder:assembleDebug --no-daemon --build-cache --stacktrace
          fi
          test -f dataset-builder/build/outputs/apk/debug/dataset-builder-debug.apk
          ls -lh dataset-builder/build/outputs/apk/debug/dataset-builder-debug.apk

      - name: Upload Dataset Builder APK
        uses: actions/upload-artifact@v4
        with:
          name: dataset-builder-debug
          path: dataset-builder/build/outputs/apk/debug/dataset-builder-debug.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: form-snap-arm32-java-opencv
          path: app/build/outputs/apk/release/app-release.apk
