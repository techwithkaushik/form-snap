name: Android

on:
  workflow_dispatch:
  push:
    branches:
      - feature/foundation-pipeline
      - feature/universal-tflite-no-dataset-builder
      - ai-objectsnap
  pull_request:
    branches:
      - feature/foundation-pipeline

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the PR head, not the target branch, so CI validates proposed changes.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Compute branch version and commit count
        id: app-version
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          BRANCH="${SOURCE_BRANCH//\//-}"
          BRANCH="$(printf '%s' "$BRANCH" | tr -cd '[:alnum:]._-')"
          test -n "$BRANCH"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          if git ls-remote --exit-code --heads origin "$DEFAULT_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
              COMMIT_COUNT="$(git rev-list --count HEAD)"
            else
              COMMIT_COUNT="$(git rev-list --count HEAD "^origin/$DEFAULT_BRANCH")"
            fi
          else
            COMMIT_COUNT="$(git rev-list --count HEAD)"
          fi
          VERSION_CODE=$((COMMIT_COUNT + 1))
          VERSION_NAME="${BRANCH}-${SHORT_SHA}"
          APK_NAME="AI-ObjectSnap-${VERSION_NAME}-c${COMMIT_COUNT}.apk"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Building $APK_NAME (versionCode=$VERSION_CODE)"
      - name: Cache OpenCV Android SDK
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: opencv/
          key: opencv-android-sdk-5.0.0-${{ runner.os }}

      - name: Download OpenCV Android SDK 5.0.0
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          OPENCV_VERSION="5.0.0"
          ZIP="$RUNNER_TEMP/opencv-android-sdk.zip"
          ROOT="$RUNNER_TEMP/opencv-sdk"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/opencv/opencv/releases/download/${OPENCV_VERSION}/opencv-${OPENCV_VERSION}-android-sdk.zip" \
            -o "$ZIP"
          rm -rf "$ROOT" opencv
          mkdir -p "$ROOT" opencv
          unzip -q "$ZIP" -d "$ROOT"
          SDK_DIR="$(find "$ROOT" -type d -path '*/sdk' -print -quit)"
          test -n "$SDK_DIR"
          test -d "$SDK_DIR/java"
          cp -R "$SDK_DIR/." opencv/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: false

      - name: Download bootstrap YOLOv8 model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="core/ai/src/main/assets"
          MODEL="$MODEL_DIR/formsnap_bootstrap_yolov8n_float32.tflite"
          mkdir -p "$MODEL_DIR"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/naz23/yolo-tensorflow-lite/main/yolov8n_float32.tflite" \
            -o "$MODEL"
          test -s "$MODEL"
          test "$(stat -c%s "$MODEL")" -gt 1000000
          ls -lh "$MODEL"

      - name: Remove AI model before APK packaging
        shell: bash
        run: |
          set -euo pipefail
          MODEL="core/ai/src/main/assets/formsnap_bootstrap_yolov8n_float32.tflite"
          test -f "$MODEL"
          rm -f "$MODEL"
          test ! -e "$MODEL"

      - name: Decode Keystore
        id: keystore
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: dev_keystore.jks
          encodedString: ${{ secrets.SIGNING_KEYSTORE }}

      - name: Build signed APK
        env:
          SIGN_KEY_STORE: ${{ steps.keystore.outputs.filePath }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          APP_VERSION_CODE: ${{ steps.app-version.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.app-version.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon --build-cache --stacktrace
          else
            gradle :app:assembleRelease --no-daemon --build-cache --stacktrace
          fi

      - name: Verify APK and report download size
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$SOURCE_APK"
          APK="app/build/outputs/apk/release/${{ steps.app-version.outputs.apk_name }}"
          cp "$SOURCE_APK" "$APK"
          ls -lh "$APK"
          echo "APK_SIZE_BYTES=$(stat -c%s "$APK")"
          echo "Native library entries (compression method and size):"
          unzip -lv "$APK" | grep -E 'lib/armeabi-v7a/.*\.so$' || true
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-ObjectSnap-${{ steps.app-version.outputs.version_name }}-c${{ steps.app-version.outputs.commit_count }}
          path: app/build/outputs/apk/release/${{ steps.app-version.outputs.apk_name }}
          if-no-files-found: error
