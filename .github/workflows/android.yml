name: Android

on:
  workflow_dispatch:
  push:
    branches:
      - feature/foundation-pipeline
  pull_request:
    branches:
      - feature/foundation-pipeline

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/foundation-pipeline
          fetch-depth: 1
          submodules: false

      - name: Download OpenCV Android SDK 5.0.0
        shell: bash
        run: |
          set -euo pipefail
          OPENCV_VERSION="5.0.0"
          ZIP="$RUNNER_TEMP/opencv-android-sdk.zip"
          ROOT="$RUNNER_TEMP/opencv-sdk"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/opencv/opencv/releases/download/${OPENCV_VERSION}/opencv-${OPENCV_VERSION}-android-sdk.zip" \
            -o "$ZIP"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          unzip -q "$ZIP" -d "$ROOT"
          SDK_DIR="$(find "$ROOT" -type d -path '*/sdk' -print -quit)"
          test -n "$SDK_DIR"
          test -d "$SDK_DIR/java"
          test -f "$SDK_DIR/java/build.gradle"
          test -f "$SDK_DIR/java/src/main/java/org/opencv/android/OpenCVLoader.java"
          rm -rf opencv
          mkdir -p opencv
          cp -R "$SDK_DIR/java/." opencv/
          echo "Using OpenCV Java SDK from: $SDK_DIR/java"
          find opencv -maxdepth 2 -type f | sort | head -50

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: enhanced
          validate-wrappers: false

      - name: Decode Keystore
        id: keystore
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: dev_keystore.jks
          encodedString: ${{ secrets.SIGNING_KEYSTORE }}

      - name: Build signed APK
        env:
          SIGN_KEY_STORE: ${{ steps.keystore.outputs.filePath }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon --build-cache --stacktrace
          else
            gradle :app:assembleRelease --no-daemon --build-cache --stacktrace
          fi

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: form-snap-arm32-java-opencv
          path: app/build/outputs/apk/release/app-release.apk
