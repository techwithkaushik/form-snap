name: Android

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.8'
          cache-provider: enhanced

      - name: Decode Keystore
        id: keystore
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: 'dev_keystore.jks'
          encodedString: ${{ secrets.SIGNING_KEYSTORE }}

      - name: Build foundation modules
        env:
          SIGN_KEY_STORE: ${{ steps.keystore.outputs.filePath }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -e
          if [ -x "./gradlew" ]; then
            ./gradlew :core:database:dependencies --configuration androidReleaseCompileClasspath --no-daemon --build-cache
            ./gradlew :core:database:tasks --all --no-daemon --build-cache | grep -E "compile.*KotlinAndroid|android.*CompileClasspath|androidTarget" || true
            ./gradlew :core:database:compileReleaseKotlinAndroid :core:database:assembleRelease :feature:capture:compileReleaseKotlinAndroid :feature:capture:assembleRelease --no-daemon --build-cache
          else
            gradle :core:database:dependencies --configuration androidReleaseCompileClasspath --no-daemon --build-cache
            gradle :core:database:tasks --all --no-daemon --build-cache | grep -E "compile.*KotlinAndroid|android.*CompileClasspath|androidTarget" || true
            gradle :core:database:compileReleaseKotlinAndroid :core:database:assembleRelease :feature:capture:compileReleaseKotlinAndroid :feature:capture:assembleRelease --no-daemon --build-cache
          fi
