name: Device-only AI training policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Enforce on-device training direction
    runs-on: ubuntu-latest
    steps:
      - name: Confirm training is not run on GitHub-hosted servers
        shell: bash
        run: |
          set -euo pipefail
          echo "FormSnap model training must run locally on the Android device."
          echo "This workflow intentionally does not download datasets, use secrets, train models, or upload artifacts."
          echo "GitHub Actions remains for build and test CI only."
